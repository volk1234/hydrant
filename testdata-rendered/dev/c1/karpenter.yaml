apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-c1
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    hydrant.sh/source-config: cluster-init/apps/karpenter/config-dev.yaml
  labels:
    app.kubernetes.io/name: karpenter-c1
    env: dev
    parent-app: cluster-init-dev
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.13.0
    helm:
      releaseName: karpenter-c1
      skipSchemaValidation: true
      valuesObject:
        enabled: yes
        image:
          repository: nginx
          tag: "1.11"
        release: 2024-01-01
        resources:
          requests:
            cpu: 2
        script: |-
          line1
          line2
        settings:
          aws:
            defaultInstanceProfile: eks_worker-c1
          clusterName: c1
          interruptionQueue: karpenter-c1
          region: "euw1"
        tolerations:
          - key: b
  destination:
    name: c1
    namespace: platform-system
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        elbv2.k8s.aws/pod-readiness-gate-inject: enabled
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=false
    automated:
      enabled: true
      selfHeal: true
      prune: true

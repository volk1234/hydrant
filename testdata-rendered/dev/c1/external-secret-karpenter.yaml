apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secret-karpenter-c1
  namespace: argocd
  labels:
    app.kubernetes.io/name: external-secret-karpenter-c1
    env: dev
    parent-app: external-secrets-dev
spec:
  project: default
  source:
    repoURL: git@github.com:volk1234/turing.git
    path: cluster-init/apps/karpenter/external_secrets/dev/
    targetRevision: ""
  destination:
    name: c1
    namespace: platform-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      selfHeal: true
      prune: true

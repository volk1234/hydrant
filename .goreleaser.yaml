version: 2

builds:
  - id: hydrant
    main: ./cmd/hydrant
    binary: hydrant
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: hydrant
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  abbrev: -1
  format: "{{ .Message }}"
  filters:
    include:
      - '^(feat|fix|refactor|doc|bump)(\(.+\))?!?:'
  groups:
    - title: Breaking changes
      regexp: '^\w+(\(.+\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: Bug fixes
      regexp: '^fix(\(.+\))?:'
      order: 2
    - title: Documentation
      regexp: '^doc(\(.+\))?:'
      order: 3
    - title: Dependencies
      regexp: '^bump(\(.+\))?:'
      order: 4
    - title: Other
      order: 999


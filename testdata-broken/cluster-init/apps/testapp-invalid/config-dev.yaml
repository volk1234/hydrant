app:
  name: Karpenter
  helmchart:
    repoURL: ''
    name: karpenter
    path: "charts/karpenter"
    default:
      targetRevision: 1.13.0
      valuesRevision: HEAD
  destination:
    namespace: platform-system
    clusters: {}
    profile: "base"
argocd:
  namespace: argocd
  server_side_apply: true
  sync_wave: 1
  autosync:
    enabled: true
    selfheal: true
    prune: true

inline_values: |
  settings:
    clusterName: [CLUSTER_NAME]
    interruptionQueue: karpenter-[CLUSTER_NAME]
    aws:
      defaultInstanceProfile: eks_worker-[CLUSTER_NAME]
